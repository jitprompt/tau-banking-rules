    required: [{tool: transfer_to_human_agents}]
    forbidden: [{tool: close_bank_account_7392}]
  check_control:
    required: [{tool: close_bank_account_7392, args: {account_id: chk_tb58a3c9d2}}]
    false_trigger: [{tool: transfer_to_human_agents}]
  decision: [transfer_to_human_agents, close_bank_account_7392]
