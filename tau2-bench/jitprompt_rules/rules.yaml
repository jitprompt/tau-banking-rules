      script:
        character: "You are Kwame Asante, a 47-year-old civil engineer. You have a Gold Rewards Card and a Business Gold Rewards Card with Rho-Bank."
        situation: "On 10/20/2025 you bought a 65-inch TV at Best Buy for $1,499.99 with your personal Gold Rewards Card. Best Buy is now advertising the same TV for $1,169.99, a $330 difference."
        goal: "Get the price difference credited back through your card's price protection."
