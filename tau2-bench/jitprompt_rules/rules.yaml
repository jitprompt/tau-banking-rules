- id: R09
  type: exception
  category: credit_cards
  trigger: "Gold Rewards closure over the annual fee on an account open fewer than 180 days (Gold waiver overrides the 180-day minimum for retention offers)"
  docs:
    - id: doc_credit_cards_operational_update_904
      placement: standalone
      title: "Internal: Retention Offers - Minimum Account Age"
      text: |
        ## Eligibility for Retention Offers

        - Retention offers of any kind (annual fee waivers, bonus points, statement credits) are only available on credit card accounts that have been open for at least 180 days.
        - Calculate the account age from the account open date.

        ## Accounts Open Fewer Than 180 Days

        - Do not make a retention offer.
        - Log the customer's closure reason and, if the account meets the closure requirements, proceed with the closure once the customer confirms.
    - id: doc_credit_cards_gold_rewards_card_005
      placement: buried
      section: "Annual Fee Waiver for Gold Rewards Cardholders (Internal)"
      text: |
        - When a Gold Rewards cardholder asks to close their account because of the annual fee, offer a 12-month annual fee waiver, however long the account has been open.
        - If the customer accepts, apply it with apply_credit_card_account_flag_6147: flag_type 'annual_fee_waived', expiration_date one year from today, reason 'retention_offer'. The account stays open.
        - If the customer declines, continue with the standard closure process.
  check:
    required: [{tool: apply_credit_card_account_flag_6147, args: {credit_card_account_id: cc_af0581dcbf_gold, flag_type: annual_fee_waived}}]
    forbidden: [{tool: close_credit_card_account_7834}]
  check_control:
    required: [{tool: close_credit_card_account_7834, args: {credit_card_account_id: cc_755bcb4d5d_silver}}]
    false_trigger: [{tool: apply_credit_card_account_flag_6147}, {tool: apply_statement_credit_8472, args: {reason: retention_offer}}]
