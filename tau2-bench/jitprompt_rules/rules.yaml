- id: R04
  type: threshold
  category: credit_cards
  trigger: "second expedited replacement on the same account within 12 months"
  docs:
    - id: doc_credit_cards_operational_update_902
      placement: standalone
      title: "Internal: Replacement Cards - Expedited Shipping Frequency"
      text: |
        ## Frequency Limit

        - Expedited shipping on replacement credit cards is limited to one expedited replacement per credit card account in any rolling 12-month period. This applies to every card tier, including tiers where expedited shipping is complimentary.

        ## Checking Prior Replacements

        - Before offering expedited shipping, review the account's replacement history with get_pending_replacement_orders_5765. The tool lists every replacement order on the account, including delivered ones, with the order date and whether it shipped expedited.

        ## When the Limit Has Been Reached

        - If an expedited replacement was ordered for the account within the last 12 months, place the new replacement with standard delivery (expedited_shipping: false) and let the customer know to expect it in 7–10 business days.
  check:
    required: [{tool: order_replacement_credit_card_7291, args: {credit_card_account_id: cc_76ad9cc60e_gold, expedited_shipping: false}}]
    forbidden: [{tool: order_replacement_credit_card_7291, args: {expedited_shipping: true}}]
  check_control:
    required: [{tool: order_replacement_credit_card_7291, args: {credit_card_account_id: cc_af0581dcbf_gold, expedited_shipping: true}}]
    false_trigger: [{tool: order_replacement_credit_card_7291, args: {expedited_shipping: false}}]
  decision: [order_replacement_credit_card_7291]
  tasks:
    triggered:
      user: 76ad9cc60e
      setup:
        credit_card_orders: {data: {ccord_76ad9cc60e_gold_001: {order_id: ccord_76ad9cc60e_gold_001, credit_card_account_id: cc_76ad9cc60e_gold, user_id: 76ad9cc60e, shipping_address: "__ADDRESS__", reason: lost, expedited_shipping: true, order_date: "06/12/2025", expected_delivery: "06/16/2025", status: DELIVERED}}}
      script:
        character: "You are Wei Chen, a 45-year-old restaurant owner. You have a Gold Rewards Card with Rho-Bank."
        situation: "The chip on your Gold Rewards Card stopped working and terminals keep rejecting it. You use the card for supplier payments, so you want the replacement as fast as possible."
        goal: "Order a replacement for your damaged Gold Rewards Card, with expedited shipping if possible."
        opening: "Hi, the chip on my Gold Rewards Card stopped working and I need a replacement. Can you send it with expedited shipping? I use it for my business every day."
        flow:
          - "If asked about the reason: the card is damaged (chip not working)."
          - "Confirm your address on file as the shipping address."
          - "If the agent says expedited shipping is not available this time, accept: \"Okay, standard shipping is fine then.\""
          - "Once the replacement is ordered, thank the agent and end the conversation."
      actions:
        - verify
        - [order_replacement_credit_card_7291, {credit_card_account_id: cc_76ad9cc60e_gold, user_id: 76ad9cc60e, shipping_address: "__ADDRESS__", reason: damaged, expedited_shipping: false}]
      docs: [doc_credit_cards_credit_card_replacements_001, doc_credit_cards_credit_card_replacements_002, doc_credit_cards_credit_card_replacements_005]
    control:
      user: af0581dcbf
      setup:
        credit_card_orders: {data: {ccord_af0581dcbf_gold_001: {order_id: ccord_af0581dcbf_gold_001, credit_card_account_id: cc_af0581dcbf_gold, user_id: af0581dcbf, shipping_address: "__ADDRESS__", reason: lost, expedited_shipping: true, order_date: "08/20/2024", expected_delivery: "08/23/2024", status: DELIVERED}}}
