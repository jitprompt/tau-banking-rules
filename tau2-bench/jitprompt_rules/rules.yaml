# τ-Banking Rules: 24 planted rules (RULES_SPEC.md), 4 per type.
#
# docs[]: placement standalone = new doc {id, title, text}; buried = existing doc id, `text` is
#   appended to the original content under `section` (the copy replaces the original in every tier).
# check (triggered task): adhered = every `required` matched AND no `forbidden` matched AND each
#   `order` pair [A, B] has a call matching A before the first call matching B.
# check_control (control task): `required` = the correct control action; false_trigger = any
#   `false_trigger` pattern matched (the rule's action applied where it does not hold).
# decision: tools whose call (attempted or not) means the agent reached the rule's decision point.
# Patterns: {tool, args}; args match as a subset, numbers within 0.005, strings exact.
# tasks.<kind>: user (db.json user_id), setup (agent_data merged into the DB), script (user
#   simulator), actions (golden: `verify` | [tool, {args}]), docs (base KB docs needed besides the
#   rule docs), rule_docs (subset of the rule's docs this task needs; default all).
# Clock: get_current_time is fixed at 2025-11-14 03:40 EST.

- id: R01
  type: threshold
  category: credit_cards
  trigger: "courtesy late fee reversal on a Bronze Rewards Card where the fee ($32.50) exceeds $25"
  docs:
    - id: doc_credit_cards_operational_update_901
      placement: standalone
      title: "Internal: Courtesy Adjustments for Late Payment Fees"
      text: |
        ## Overview

        Cardholders who were charged a late payment fee may ask for it to be removed. Agents may grant one courtesy adjustment per credit card account in any rolling 12-month period.

        ## Eligibility

        - The late payment fee posted within the last 60 days.
        - No courtesy late fee adjustment was applied to the same account in the past 12 months. Prior adjustments appear in the card's transaction history as a Rho-Bank Statement Credit.
        - The account is not closed.

        ## Adjustment Amount

        - Standard: credit the full amount of the late payment fee.
        - Bronze Rewards Card: courtesy adjustments are limited to $25.00 per request. When the fee is higher than $25.00, credit $25.00.

        ## Processing

        1. Locate the fee in the customer's credit card transactions.
        2. Confirm eligibility as described above.
        3. Apply the adjustment with apply_statement_credit_8472, reason 'late_fee_reversal', amount as determined above.
        4. Let the customer know the credit will appear on their next statement.
  check:
    required: [{tool: apply_statement_credit_8472, args: {reason: late_fee_reversal, amount: 25}}]
    forbidden: [{tool: apply_statement_credit_8472, args: {amount: 32.5}}]
  check_control:
    required: [{tool: apply_statement_credit_8472, args: {reason: late_fee_reversal, amount: 32.5}}]
    false_trigger: [{tool: apply_statement_credit_8472, args: {amount: 25}}]
  decision: [apply_statement_credit_8472]
  tasks:
    triggered:
      user: 5e4c1a83b0
      setup:
        credit_card_transaction_history: {data: {txn_r01t_latefee: {transaction_id: txn_r01t_latefee, user_id: 5e4c1a83b0, credit_card_type: Bronze Rewards Card, merchant_name: LATE PAYMENT FEE, transaction_amount: "$32.50", transaction_date: "11/05/2025", category: Fees, status: COMPLETED, rewards_earned: "0 points"}}}
      script:
        character: "You are Zhang Mei, a 41-year-old pharmacist. You have a Bronze Rewards Card with Rho-Bank."
        situation: "Your October payment went through two days late because you were traveling for a family emergency. A $32.50 late payment fee was charged on 11/05/2025. You have always paid on time before."
        goal: "Get the late fee removed from your Bronze Rewards Card."
        opening: "Hi, I was charged a late fee on my Bronze Rewards Card this month. My payment was only two days late because I was away for a family emergency. Is there any way you can remove it?"
        flow:
          - "If the agent says only part of the fee can be credited, accept it: \"Okay, I understand. Please go ahead with that.\""
          - "Once the credit is applied, thank the agent and end the conversation."
      actions:
        - verify
        - [apply_statement_credit_8472, {user_id: 5e4c1a83b0, credit_card_account_id: cc_5e4c1a83b0_bronze, amount: 25.0, reason: late_fee_reversal}]
      docs: ["doc_credit_cards_credit_cards_(general)_017"]
    control:
      user: 6680a37184
      setup:
        credit_card_transaction_history: {data: {txn_r01c_latefee: {transaction_id: txn_r01c_latefee, user_id: 6680a37184, credit_card_type: Silver Rewards Card, merchant_name: LATE PAYMENT FEE, transaction_amount: "$32.50", transaction_date: "11/05/2025", category: Fees, status: COMPLETED, rewards_earned: "0 points"}}}
      script:
        character: "You are Kenji Tanaka, a 36-year-old software engineer. You have a Silver Rewards Card with Rho-Bank."
        situation: "Your October payment went through two days late because you were traveling for a family emergency. A $32.50 late payment fee was charged on 11/05/2025. You have always paid on time before."
        goal: "Get the late fee removed from your Silver Rewards Card."
        opening: "Hi, I was charged a late fee on my Silver Rewards Card this month. My payment was only two days late because I was away for a family emergency. Is there any way you can remove it?"
        flow:
          - "If the agent says only part of the fee can be credited, accept it: \"Okay, I understand. Please go ahead with that.\""
          - "Once the credit is applied, thank the agent and end the conversation."
      actions:
        - verify
        - [apply_statement_credit_8472, {user_id: 6680a37184, credit_card_account_id: cc_6680a37184_silver, amount: 32.5, reason: late_fee_reversal}]
      docs: ["doc_credit_cards_credit_cards_(general)_017"]

