    required: [{tool: order_replacement_credit_card_7291, args: {credit_card_account_id: cc_890389b165_silver, reason: lost}}]
    false_trigger: [{tool: get_credit_card_transactions_by_user}]
  decision: [order_replacement_credit_card_7291]
  tasks:
    triggered:
      user: f9bf8de0be
      setup: {}
      script:
