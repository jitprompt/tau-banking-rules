  category: credit_cards
  trigger: "replacement for a stolen card: review recent transactions before ordering"
  docs:
    - id: doc_credit_cards_credit_card_replacements_001
      placement: buried
      section: "Theft and Fraud Replacements: Transaction Review"
      text: |
        - When the replacement reason is 'stolen' or 'fraud_suspected', go through the card's recent transactions with the customer before ordering the replacement: retrieve them with get_credit_card_transactions_by_user and confirm which recent charges the customer recognizes. Ordering the replacement cancels the old card, and charges are harder to match to the compromised card afterwards.
        - Then place the replacement order.
  check:
    required: [{tool: order_replacement_credit_card_7291, args: {credit_card_account_id: cc_f9bf8de0be_diamond, reason: stolen}}]
    order: [[{tool: get_credit_card_transactions_by_user}, {tool: order_replacement_credit_card_7291}]]
