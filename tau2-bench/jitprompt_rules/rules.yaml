        - [order_replacement_credit_card_7291, {credit_card_account_id: cc_01f21c9970_gold, user_id: 01f21c9970, shipping_address: "330 N Wabash Ave, Chicago, IL 60611", reason: damaged, expedited_shipping: false}]
