- id: R17
  type: near_duplicate
  category: credit_cards
  trigger: "price protection claim on a Gold Rewards Card above the $250 per-item maximum"
  docs:
    - id: doc_credit_cards_operational_update_909
      placement: standalone
      title: "Gold Rewards Card: Price Protection"
      text: |
        ## Coverage

        - If an item bought with the Gold Rewards Card is advertised at a lower price within 60 days of purchase, the cardholder can claim the difference as a statement credit.

        ## Claim Limits

        - Maximum credit per item: $250.
        - Maximum of 4 claims per calendar year.

        ## Processing (Internal)

        - Confirm the purchase in the customer's credit card transactions and the lower advertised price the customer reports.
        - Apply the difference, up to the per-item maximum, with apply_statement_credit_8472, reason 'price_match'.
    - id: doc_credit_cards_operational_update_910
      placement: standalone
      title: "Platinum Rewards Card: Price Protection"
      text: |
        ## Coverage

        - If an item bought with the Platinum Rewards Card is advertised at a lower price within 60 days of purchase, the cardholder can claim the difference as a statement credit.

        ## Claim Limits

        - Maximum credit per item: $500.
        - Maximum of 6 claims per calendar year.

        ## Processing (Internal)

        - Confirm the purchase in the customer's credit card transactions and the lower advertised price the customer reports.
        - Apply the difference, up to the per-item maximum, with apply_statement_credit_8472, reason 'price_match'.
  check:
    required: [{tool: apply_statement_credit_8472, args: {credit_card_account_id: cc_01f21c9970_gold, reason: price_match, amount: 250}}]
    forbidden: [{tool: apply_statement_credit_8472, args: {amount: 330}}]
  check_control:
    required: [{tool: apply_statement_credit_8472, args: {credit_card_account_id: cc_224959b99e_plat, reason: price_match, amount: 330}}]
    false_trigger: [{tool: apply_statement_credit_8472, args: {amount: 250}}]
  decision: [apply_statement_credit_8472]
  tasks:
    triggered:
      user: 01f21c9970
